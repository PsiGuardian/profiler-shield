name: Bundle validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', symfony: '5.4'}
          - {php: '8.3', symfony: '6.4'}
          - {php: '8.3', symfony: '7.4'}
          - {php: '8.4', symfony: '7.4'}
          - {php: '8.4', symfony: '8.1'}
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: openssl, mbstring, xml, curl, zip
          coverage: none
      - name: Pin Symfony branch in the disposable CI checkout
        env:
          SYMFONY_BRANCH: ${{ matrix.symfony }}
        run: |
          php -r '$p=json_decode(file_get_contents("composer.json"),true);foreach(["require","require-dev"] as $section){foreach($p[$section] as $k=>$v){if(str_starts_with($k,"symfony/"))$p[$section][$k]=getenv("SYMFONY_BRANCH").".*";}}file_put_contents("composer.json",json_encode($p,JSON_PRETTY_PRINT).PHP_EOL);'
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress --prefer-dist --no-plugins --no-scripts
      - name: PHP syntax
        run: find src tests translations tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/password_model.js
      - name: Preserve manually maintained and deleted documentation
        run: python3 tests/documentation_generator.py
      - name: Documentation sources and generated pages stay synchronized
        run: |
          python3 tools/documentation/generate.py
          git diff --exit-code -- docs README.md INSTALLATION.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md CHANGELOG.md examples/README.md
      - run: composer test
      - run: vendor/bin/phpunit -c phpunit.xml.dist
      - run: composer --no-plugins audit --locked
      - name: Require complete localization keys (native review remains separate)
        run: php tests/translation_audit.php --strict
